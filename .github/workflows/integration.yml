# Integration run on a real Windows runner (elevated). Runs on demand and when
# the workflow or anything under src changes.
# Author: Ahmad Shaukat
# Captures raw tool output for test fixtures. Nothing from Sysinternals is
# committed to the repo; only the CSV output is uploaded as an artifact.
name: Integration

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/integration.yml'
      - 'src/**'

permissions:
  contents: read

jobs:
  autoruns-fixture:
    name: Capture Autoruns CSV
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Download, verify and run autorunsc
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          $work = Join-Path $env:RUNNER_TEMP 'autoruns'
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          $zip = Join-Path $work 'Autoruns.zip'
          Invoke-WebRequest -Uri 'https://download.sysinternals.com/files/Autoruns.zip' -OutFile $zip -UseBasicParsing
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try { $z.Entries | ForEach-Object { '{0}  {1}' -f $_.FullName, $_.Length } } finally { $z.Dispose() }
          Expand-Archive -Path $zip -DestinationPath $work -Force
          $exe = Join-Path $work 'autorunsc64.exe'
          $sig = Get-AuthenticodeSignature -LiteralPath $exe
          'Signature: {0} | {1}' -f $sig.Status, $sig.SignerCertificate.Subject
          if ($sig.Status -ne 'Valid') { throw 'autorunsc64.exe is not validly signed' }
          $out = Join-Path $work 'autoruns.csv'
          $p = Start-Process -FilePath $exe -ArgumentList '-accepteula', '-a', '*', '-c', '-h', '-s', '-t', '*' -RedirectStandardOutput $out -NoNewWindow -Wait -PassThru
          'ExitCode: {0}' -f $p.ExitCode
          $bytes = [System.IO.File]::ReadAllBytes($out)
          'Bytes: {0} | first 8: {1}' -f $bytes.Length, (($bytes | Select-Object -First 8) -join ',')
          New-Item -ItemType Directory -Path fixtures-out -Force | Out-Null
          Copy-Item -LiteralPath $out -Destination 'fixtures-out\autoruns-full.csv'

          # Trimmed fixture: the real header plus up to 3 real rows per
          # category and signer class, written back as UTF-16 LE with BOM like
          # the original. Printed gzip+base64 so it can be read from the log.
          $lines = @([System.IO.File]::ReadAllText($out, [System.Text.Encoding]::Unicode) -split "`r?`n")
          $header = $lines[0]
          'Rows (parsed): {0} | lines: {1}' -f @(ConvertFrom-Csv -InputObject @($lines | Where-Object { $_ })).Count, $lines.Count
          $keep = New-Object System.Collections.Generic.List[string]
          $keep.Add($header)
          $seen = @{}
          for ($i = 1; $i -lt $lines.Count; $i++) {
            $l = $lines[$i]
            if (-not $l) { continue }
            $r = @(ConvertFrom-Csv -InputObject @($header, $l))[0]
            $cls = if (-not $r.Entry) { 'location' } elseif ($r.Signer -like '(Verified) Microsoft*') { 'ms' } elseif ($r.Signer -like '(Verified)*') { 'verified' } else { 'other' }
            $k = '{0}|{1}' -f $r.Category, $cls
            if (-not $seen.ContainsKey($k)) { $seen[$k] = 0 }
            if ($seen[$k] -lt 3) { $seen[$k]++; $keep.Add($l) }
          }
          $fixture = 'fixtures-out\autoruns.csv'
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) $fixture), (($keep -join "`r`n") + "`r`n"), [System.Text.Encoding]::Unicode)
          $seen.Keys | Sort-Object | ForEach-Object { 'class {0} = {1}' -f $_, $seen[$_] }
          $raw = [System.IO.File]::ReadAllBytes((Join-Path (Get-Location) $fixture))
          $ms = New-Object System.IO.MemoryStream
          $gz = New-Object System.IO.Compression.GZipStream($ms, [System.IO.Compression.CompressionMode]::Compress)
          $gz.Write($raw, 0, $raw.Length); $gz.Dispose()
          $b64 = [Convert]::ToBase64String($ms.ToArray())
          'FIXTURE-BEGIN bytes={0} sha256={1}' -f $raw.Length, (Get-FileHash -LiteralPath $fixture -Algorithm SHA256).Hash
          for ($o = 0; $o -lt $b64.Length; $o += 120) { 'B64:' + $b64.Substring($o, [Math]::Min(120, $b64.Length - $o)) }
          'FIXTURE-END'

      - uses: actions/upload-artifact@v4
        with:
          name: fixtures
          path: fixtures-out

  pro-tools:
    name: Pro Tools pipeline on a real runner
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: GetNewClosure scope semantics on Windows PowerShell 5.1
        run: |
          $script:Probe = 'outer'
          function Test-Closure { $sb = { "closure reads script:Probe = [$script:Probe]" }.GetNewClosure(); & $sb }
          Test-Closure
          $PSVersionTable.PSVersion.ToString()

      - name: Autoruns via the tool's own downloader, signature check, run, cards and tamper refusal
        run: |
          $ErrorActionPreference = 'Stop'
          . .\src\SecurityCore.ps1
          Initialize-Core | Out-Null
          [void](Initialize-SecureToolsRoot)
          $say = { param($m) [Console]::WriteLine('  ' + $m) }
          $res = Resolve-ExternalToolRelease -Key 'autoruns'
          'Resolved {0} ({1} MB, integrity: {2})' -f $res.DownloadUrl, $res.SizeMB, $res.Sha256Source
          $inst = Install-ExternalTool -Key 'autoruns' -ConsentAccepted -Resolution $res -Progress $say
          if (-not $inst.Success) { throw $inst.Message }
          'Installed {0}' -f $inst.ExePath
          'Signer: {0}' -f (Get-AuthenticodeSignature -LiteralPath $inst.ExePath).SignerCertificate.Subject
          'Test-MicrosoftSigned: {0}' -f (Test-MicrosoftSigned -Path $inst.ExePath)
          $cards = @(Invoke-ExternalDfirScan -Key 'autoruns' -ExePath $inst.ExePath -Progress $say)
          'Cards: {0}' -f $cards.Count
          foreach ($c in $cards) { '  [{0}/{1}] {2} | paths {3}' -f $c.Status, $c.Severity, $c.Title, @($c.Paths).Count }
          if ($cards.Count -eq 0) { throw 'No cards were produced.' }
          $base = Join-Path $env:ProgramData 'Win11SecurityOptimizer'
          'Base tree owned by Administrators/SYSTEM: {0}' -f (Test-TreeOwnership -Root $base)
          'Tools root secure: {0}' -f (Test-ToolsRootSecure)
          if (-not (Test-TreeOwnership -Root $base)) { throw 'The next launch would quarantine the base.' }
          $b = [System.IO.File]::ReadAllBytes($inst.ExePath)
          $b[4096] = $b[4096] -bxor 0xFF
          [System.IO.File]::WriteAllBytes($inst.ExePath, $b)
          $refused = $false
          try { Invoke-ExternalDfirScan -Key 'autoruns' -ExePath $inst.ExePath | Out-Null } catch { $refused = $true; 'Refused after one flipped byte: {0}' -f $_.Exception.Message }
          if (-not $refused) { throw 'A tampered exe was NOT refused.' }

      - name: Chainsaw pinned download and --level support
        # Unauthenticated GitHub API calls from shared runner IPs are often rate
        # limited (403), which says nothing about the tool, so this is advisory.
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          . .\src\SecurityCore.ps1
          Initialize-Core | Out-Null
          [void](Initialize-SecureToolsRoot)
          $say = { param($m) [Console]::WriteLine('  ' + $m) }
          $res = Resolve-ExternalToolRelease -Key 'chainsaw'
          'Resolved {0} {1} (integrity: {2})' -f $res.Name, $res.Version, $res.Sha256Source
          $inst = Install-ExternalTool -Key 'chainsaw' -ConsentAccepted -Resolution $res -Progress $say
          if (-not $inst.Success) { throw $inst.Message }
          $help = (& $inst.ExePath 'hunt' '--help' 2>&1 | Out-String)
          'hunt --help lists --level: {0}' -f ($help -match '--level')

      - name: GUI self-test (best effort; needs a desktop session)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          $p = Start-Process -FilePath powershell.exe -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-STA', '-File', '.\src\Optimizer.ps1', '-SelfTest' -NoNewWindow -Wait -PassThru -RedirectStandardOutput selftest.out.txt -RedirectStandardError selftest.err.txt
          'Exit code: {0}' -f $p.ExitCode
          Get-Content selftest.out.txt -ErrorAction SilentlyContinue
          Get-Content selftest.err.txt -ErrorAction SilentlyContinue | Select-Object -First 30

  baseline:
    name: Baseline save and compare on real data
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot, save, compare
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version 2.0
          . .\src\SecurityCore.ps1
          Initialize-Core | Out-Null
          $snap = Get-SystemSnapshot
          'Errors: [{0}]' -f (@($snap.Errors.Keys) -join ', ')
          foreach ($k in @($snap.Collections.Keys)) { '  {0}: {1}' -f $k, $(if ($null -eq $snap.Collections[$k]) { 'ERROR' } else { @($snap.Collections[$k].Keys).Count }) }
          $p = Save-Baseline -Snapshot $snap
          'Saved {0} (owned by Administrators: {1})' -f $p, (Test-FolderOwnedBySystemOrAdmins $p)
          'Chip: {0}' -f (Get-BaselineInfo).CreatedUtc.ToString('o')
          $cards = @(Invoke-BaselineDrift)
          foreach ($c in $cards) { '  [{0}/{1}] {2}' -f $c.Status, $c.Severity, $c.Title }
          if (@($cards | Where-Object { $_.Status -eq 'Alert' }).Count -gt 0) { throw 'An immediate re-compare raised an Alert.' }
          'Base tree owned by Administrators/SYSTEM: {0}' -f (Test-TreeOwnership -Root (Join-Path $env:ProgramData 'Win11SecurityOptimizer'))
